name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        shell: bash
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          set -o pipefail
          gradle assembleRelease --no-daemon 2>&1 | tee build.log

      - name: Mostrar erros
        if: failure()
        shell: bash
        run: |
          grep -E "error:|e: |What went wrong|Could not|> " build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
          sed -n '/What went wrong/,/Try:/p' build.log | head -30 | while IFS= read -r l; do echo "::error::$l"; done

      - name: Renomear
        run: cp app/build/outputs/apk/release/app-release.apk Leve-Teclado.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Leve-Teclado
          path: Leve-Teclado.apk

      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Leve Teclado 1.0.${{ github.run_number }}
          body: APK pronto para instalar. Baixe o Leve-Teclado.apk abaixo.
          files: Leve-Teclado.apk
          make_latest: true
